<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduTeam — интерактивті тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #EEF1F6;
    --surface: #FFFFFF;
    --ink: #16213A;
    --ink-soft: #57607A;
    --primary: #3B4FA0;
    --primary-dark: #2A3A7D;
    --accent: #F5A623;
    --success: #1F9D77;
    --success-bg: #E5F5EF;
    --error: #C65146;
    --error-bg: #FBEAE8;
    --line: #DDE2EC;
    --radius-card: 22px;
    --radius-btn: 12px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(59,79,160,0.07), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(245,166,35,0.09), transparent 42%);
    color: var(--ink);
    font-family: 'Golos Text', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .stage{
    width: 100%;
    max-width: 560px;
  }

  .brand{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .brand-mark{
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    flex-shrink: 0;
  }
  .brand-name{
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .card{
    background: var(--surface);
    border-radius: var(--radius-card);
    border: 1px solid var(--line);
    box-shadow: 0 24px 48px -28px rgba(22, 33, 58, 0.28);
    padding: 40px 36px;
    position: relative;
    overflow: hidden;
  }

  @media (max-width: 520px){
    .card{ padding: 28px 22px; }
  }

  /* ---------- Views ---------- */
  .view{ display: none; }
  .view.active{ display: block; animation: rise 0.42s ease both; }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- Start view ---------- */
  .eyebrow-line{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 18px;
  }
  .eyebrow-line .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .eyebrow-line span{
    font-size: 13px;
    color: var(--ink-soft);
  }

  h1.hero{
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1.18;
    margin: 0 0 14px;
    letter-spacing: -0.01em;
  }

  p.lede{
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-soft);
    margin: 0 0 28px;
    max-width: 42ch;
  }

  .meta-row{
    display: flex;
    gap: 22px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }
  .meta-item{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .meta-item b{
    display: block;
    font-family: 'Unbounded', sans-serif;
    font-size: 20px;
    color: var(--ink);
    font-weight: 700;
  }

  button.primary-btn{
    font-family: 'Golos Text', sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    background: var(--primary);
    border: none;
    border-radius: var(--radius-btn);
    padding: 15px 26px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    width: 100%;
  }
  button.primary-btn:hover{ background: var(--primary-dark); }
  button.primary-btn:active{ transform: scale(0.99); }
  button.primary-btn:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Quiz view ---------- */
  .progress-row{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .progress-label{
    font-size: 13px;
    color: var(--ink-soft);
    font-weight: 600;
  }
  .progress-score{
    font-size: 13px;
    color: var(--ink-soft);
  }
  .progress-track{
    height: 6px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill{
    height: 100%;
    background: var(--accent);
    border-radius: 4px;
    transition: width 0.35s ease;
    width: 20%;
  }

  h2.question{
    font-family: 'Unbounded', sans-serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.35;
    margin: 0 0 24px;
    letter-spacing: -0.005em;
  }

  .options{
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 22px;
  }

  .option{
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    font-family: 'Golos Text', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-btn);
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option .letter{
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: var(--bg);
    color: var(--ink-soft);
    font-weight: 700;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .option:hover:not(:disabled){ border-color: var(--primary); }
  .option:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .option:disabled{ cursor: default; }

  .option.correct{
    border-color: var(--success);
    background: var(--success-bg);
  }
  .option.correct .letter{ background: var(--success); color: #fff; }

  .option.incorrect{
    border-color: var(--error);
    background: var(--error-bg);
  }
  .option.incorrect .letter{ background: var(--error); color: #fff; }

  .option.dim{ opacity: 0.5; }

  .next-slot{
    min-height: 52px;
  }

  button.next-btn{
    font-family: 'Golos Text', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--primary);
    background: transparent;
    border: 1.5px solid var(--primary);
    border-radius: var(--radius-btn);
    padding: 13px 22px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s ease, color 0.15s ease;
    animation: rise 0.3s ease both;
  }
  button.next-btn:hover{ background: var(--primary); color: #fff; }
  button.next-btn:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- Result view ---------- */
  .result-top{
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-bottom: 6px;
  }
  .result-score{
    font-family: 'Unbounded', sans-serif;
    font-weight: 800;
    font-size: 56px;
    line-height: 1;
    color: var(--primary);
  }
  .result-score span{
    font-size: 24px;
    color: var(--ink-soft);
    font-weight: 700;
  }
  .result-tag{
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 22px;
  }

  p.result-msg{
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink);
    margin: 0 0 28px;
  }

  .breakdown{
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 30px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  .breakdown-item{
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .breakdown-mark{
    width: 20px; height: 20px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    margin-top: 1px;
  }
  .breakdown-mark.ok{ background: var(--success); }
  .breakdown-mark.no{ background: var(--error); }

  button.ghost-btn{
    font-family: 'Golos Text', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: var(--bg);
    border: none;
    border-radius: var(--radius-btn);
    padding: 14px 22px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s ease;
  }
  button.ghost-btn:hover{ background: var(--line); }
  button.ghost-btn:focus-visible{
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">EduTeam</div>
  </div>

  <div class="card">

    <!-- START -->
    <section class="view active" id="view-start">
      <div class="eyebrow-line"><span class="dot"></span><span>IT негіздері бойынша тест</span></div>
      <h1 class="hero">IT саласындағы негізгі білімді тексер</h1>
      <p class="lede">10 жеңіл сұрақтан тұратын қысқа тест: әр сұраққа 4 жауап нұсқасы беріледі, ал нәтижені бірден автоматты түрде көресің.</p>
      <div class="meta-row">
        <div class="meta-item"><b>10</b>сұрақ</div>
        <div class="meta-item"><b>4</b>жауап нұсқасы</div>
        <div class="meta-item"><b>~3 мин</b>уақыт</div>
      </div>
      <button class="primary-btn" id="btn-start">Тестті бастау</button>
    </section>

    <!-- QUIZ -->
    <section class="view" id="view-quiz">
      <div class="progress-row">
        <span class="progress-label" id="progress-label">Сұрақ 1 / 5</span>
        <span class="progress-score" id="progress-score">Дұрыс: 0</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>

      <h2 class="question" id="question-text"></h2>
      <div class="options" id="options-wrap"></div>

      <div class="next-slot" id="next-slot"></div>
    </section>

    <!-- RESULT -->
    <section class="view" id="view-result">
      <div class="result-top">
        <div class="result-score" id="result-score">0<span>/5</span></div>
      </div>
      <div class="result-tag" id="result-tag">Нәтиже</div>
      <p class="result-msg" id="result-msg"></p>

      <div class="breakdown" id="breakdown"></div>

      <button class="ghost-btn" id="btn-restart">Қайта бастау</button>
    </section>

  </div>
</div>

<script>
  const QUESTIONS = [
    {
      q: "Компьютердің \u201Cми\u201D деп аталатын негізгі бөлігі қалай аталады?",
      options: ["Процессор (CPU)", "Тінтуір", "Монитор", "Принтер"],
      correct: 0
    },
    {
      q: "Интернетте сайттарды табу үшін не қолданылады?",
      options: ["Калькулятор", "Іздеу жүйесі (мысалы, Google)", "Принтер", "Сканер"],
      correct: 1
    },
    {
      q: "Файлды сақтауға болатын \u201Cбұлт\u201D қызметіне қандай мысал жатады?",
      options: ["Google Drive", "Microsoft Word", "Paint", "Калькулятор"],
      correct: 0
    },
    {
      q: "Компьютерде мәтін теруге арналған сыртқы құрылғы қалай аталады?",
      options: ["Пернетақта (клавиатура)", "Монитор", "Динамик", "Веб-камера"],
      correct: 0
    },
    {
      q: "Электрондық хат жіберу үшін не қажет?",
      options: ["Телефон нөмірі", "Электрондық пошта (email) мекенжайы", "Банк картасы", "Паспорт"],
      correct: 1
    },
    {
      q: "\u201CWWW\u201D аббревиатурасы нені білдіреді?",
      options: ["World Wide Web", "Windows Web Word", "Web Work Wide", "World Work Web"],
      correct: 0
    },
    {
      q: "Компьютерге зиян келтіретін зиянды бағдарлама қалай аталады?",
      options: ["Браузер", "Вирус", "Драйвер", "Курсор"],
      correct: 1
    },
    {
      q: "Файлдарды реттеп сақтауға арналған \u201Cконтейнер\u201D қалай аталады?",
      options: ["Папка (қалта)", "Пиксель", "Байт", "Сервер"],
      correct: 0
    },
    {
      q: "Сурет салуға немесе өңдеуге арналған қарапайым бағдарлама қайсы?",
      options: ["Excel", "Paint", "Калькулятор", "Блокнот"],
      correct: 1
    },
    {
      q: "Интернетке қосылмаса да компьютерде жұмыс істей алатын бағдарламалар қалай аталады?",
      options: ["Онлайн қосымшалар", "Оффлайн (жергілікті) қосымшалар", "Веб-сайттар", "Іздеу жүйелері"],
      correct: 1
    }
  ];

  const LETTERS = ["A", "B", "C", "D"];

  let current = 0;
  let scoreCount = 0;
  const userAnswers = [];

  const viewStart = document.getElementById("view-start");
  const viewQuiz = document.getElementById("view-quiz");
  const viewResult = document.getElementById("view-result");

  const progressLabel = document.getElementById("progress-label");
  const progressScore = document.getElementById("progress-score");
  const progressFill = document.getElementById("progress-fill");
  const questionText = document.getElementById("question-text");
  const optionsWrap = document.getElementById("options-wrap");
  const nextSlot = document.getElementById("next-slot");

  function showView(view){
    [viewStart, viewQuiz, viewResult].forEach(v => v.classList.remove("active"));
    view.classList.add("active");
  }

  document.getElementById("btn-start").addEventListener("click", () => {
    current = 0;
    scoreCount = 0;
    userAnswers.length = 0;
    showView(viewQuiz);
    renderQuestion();
  });

  document.getElementById("btn-restart").addEventListener("click", () => {
    current = 0;
    scoreCount = 0;
    userAnswers.length = 0;
    showView(viewQuiz);
    renderQuestion();
  });

  function renderQuestion(){
    const data = QUESTIONS[current];
    progressLabel.textContent = `Сұрақ ${current + 1} / ${QUESTIONS.length}`;
    progressScore.textContent = `Дұрыс: ${scoreCount}`;
    progressFill.style.width = `${((current) / QUESTIONS.length) * 100 + (100 / QUESTIONS.length)}%`;
    questionText.textContent = data.q;
    nextSlot.innerHTML = "";

    optionsWrap.innerHTML = "";
    data.options.forEach((optText, idx) => {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = `<span class="letter">${LETTERS[idx]}</span><span>${optText}</span>`;
      btn.addEventListener("click", () => selectAnswer(idx));
      optionsWrap.appendChild(btn);
    });
  }

  function selectAnswer(idx){
    const data = QUESTIONS[current];
    const buttons = optionsWrap.querySelectorAll(".option");
    buttons.forEach(b => b.disabled = true);

    const isCorrect = idx === data.correct;
    userAnswers.push(isCorrect);
    if (isCorrect) scoreCount++;

    buttons.forEach((b, i) => {
      if (i === data.correct) b.classList.add("correct");
      else if (i === idx) b.classList.add("incorrect");
      else b.classList.add("dim");
    });

    progressScore.textContent = `Дұрыс: ${scoreCount}`;

    const nextBtn = document.createElement("button");
    nextBtn.className = "next-btn";
    nextBtn.textContent = current + 1 < QUESTIONS.length ? "Келесі сұрақ" : "Нәтижені көру";
    nextBtn.addEventListener("click", () => {
      current++;
      if (current < QUESTIONS.length){
        renderQuestion();
      } else {
        showResult();
      }
    });
    nextSlot.innerHTML = "";
    nextSlot.appendChild(nextBtn);
  }

  function showResult(){
    const total = QUESTIONS.length;
    document.getElementById("result-score").innerHTML = `${scoreCount}<span>/${total}</span>`;

    let tag, msg;
    const pct = scoreCount / total;
    if (pct === 1){
      tag = "Тамаша нәтиже";
      msg = "Барлық сұраққа дұрыс жауап бердің. Білімің өте берік екен!";
    } else if (pct >= 0.6){
      tag = "Жақсы нәтиже";
      msg = "Жақсы нәтиже көрсеттің. Тек бірнеше сұрақта ғана қателік кетті.";
    } else if (pct >= 0.4){
      tag = "Орташа нәтиже";
      msg = "Негізгі білім бар, бірақ кейбір тақырыптарды тағы да қайталаған жөн.";
    } else {
      tag = "Жаттығу керек";
      msg = "Бұл тақырыптарды қайта қарап, тестті тағы бір рет тапсырып көр.";
    }
    document.getElementById("result-tag").textContent = tag;
    document.getElementById("result-msg").textContent = msg;

    const breakdown = document.getElementById("breakdown");
    breakdown.innerHTML = "";
    QUESTIONS.forEach((data, i) => {
      const ok = userAnswers[i];
      const row = document.createElement("div");
      row.className = "breakdown-item";
      row.innerHTML = `<span class="breakdown-mark ${ok ? "ok" : "no"}">${ok ? "✓" : "✕"}</span><span>${data.q}</span>`;
      breakdown.appendChild(row);
    });

    showView(viewResult);
  }
</script>

</body>
</html>
